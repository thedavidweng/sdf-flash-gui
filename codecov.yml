coverage:
  status:
    project:
      default:
        # Absolute floor only — same as scripts/coverage-gate.py PROJECT_MIN (99%).
        # Do NOT use threshold: 0% as a “no drop from base” rule: when previously
        # ignored code enters the metric (e.g. drive/parse after split), overall %
        # can fall while still staying above 99%. Local/CI gate ignores base drop.
        target: 99%
        # Max allowed drop from base commit (Codecov semantics). 100% = never fail
        # solely due to decrease vs base; absolute `target` is the real floor.
        threshold: 100%
    patch:
      default:
        # New/changed lines must be fully covered (same as coverage-gate.py patch).
        target: 100%
        threshold: 0%

  comment:
    layout: "condensed_header, condensed_files, condensed_footer"
    require_changes: true
    hide_project_coverage: false

# Paths excluded from Codecov metrics.
# Keep in sync with scripts/coverage-ignore.regex (llvm-cov) and Agents.md.
# CI: `scripts/coverage-ignore-sync-check.py` fails if these diverge.
#
# Do NOT ignore domain logic: command, flash, orchestration, process (lifecycle),
# sdf, drive/parse, gui/ops, gui/workers, gui/state, gui/validation, i18n.
ignore:
  # Binary entry: eframe launch + CLI process::exit
  - "src/main.rs"
  # eframe App shell / native window lifecycle
  - "src/gui/mod.rs"
  # egui view rendering only (logic is in ops/workers)
  - "src/gui/views/**"
  # OS-specific drive enumerate + backend discovery (pure parse is covered)
  - "src/drive/os.rs"
  # rfd native file dialog adapter (mocked at FileDialog trait)
  - "src/gui/file_dialog.rs"
  # NativeRunner thin OS process adapter (mocked at ProcessRunner trait)
  - "src/process_runner.rs"
