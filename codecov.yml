coverage:
  status:
    project:
      default:
        # Fixed floor (not auto) — near-100% auto baselines flake when domain
        # code grows even if every changed line is covered (patch is the real gate).
        target: 99%
        threshold: 0%
    patch:
      default:
        # New/changed lines must be fully covered.
        target: 100%
        threshold: 0%

  comment:
    layout: "condensed_header, condensed_files, condensed_footer"
    require_changes: true
    hide_project_coverage: false

# Paths excluded from Codecov metrics.
# Keep in sync with scripts/coverage-ignore.regex (llvm-cov) and Agents.md.
#
# Do NOT ignore domain logic: command, flash, orchestration, process (lifecycle),
# sdf, manifest, gui/ops, gui/workers, gui/state, gui/validation, i18n.
ignore:
  # Binary entry: eframe launch + CLI process::exit
  - "src/main.rs"
  # eframe App shell / native window lifecycle
  - "src/gui/mod.rs"
  # egui view rendering only (logic is in ops/workers)
  - "src/gui/views/**"
  # OS-specific drive enumerate + backend discovery (pure parse is covered)
  - "src/drive/os.rs"
  # rfd native file dialog adapter (mocked at FileDialog trait)
  - "src/gui/file_dialog.rs"
  # NativeRunner thin OS process adapter (mocked at ProcessRunner trait)
  - "src/process_runner.rs"

flags:
  unit:
    paths:
      - src/
    carryforward: true
