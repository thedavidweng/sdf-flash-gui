coverage:
  status:
    project:
      default:
        target: auto
        # Large pure-logic additions can lower the overall ratio slightly vs a
        # near-100% baseline; allow a small drop while keeping the patch gate high.
        threshold: 1%
    patch:
      default:
        # Explicit fixed target (not auto). New code must be substantially covered.
        target: 95%
        threshold: 0%

  comment:
    layout: "condensed_header, condensed_files, condensed_footer"
    require_changes: true
    hide_project_coverage: false

# Environment-dependent files excluded from coverage metrics:
# - main.rs: entry point, calls eframe::run_native
# - gui/mod.rs: egui app shell, requires native window
# - gui/views/*: egui view rendering (split from gui/mod.rs)
# - drive.rs: platform-specific code with #[cfg(target_os)]
# - gui/file_dialog.rs: NativeDialog impl, calls rfd (native dialogs)
ignore:
  - "src/main.rs"
  - "src/gui/mod.rs"
  - "src/gui/views/**"
  - "src/drive.rs"
  - "src/gui/file_dialog.rs"

flags:
  unit:
    paths:
      - src/
    carryforward: true
