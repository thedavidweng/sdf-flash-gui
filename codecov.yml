# Validated with: curl --data-binary @codecov.yml https://codecov.io/validate
# NOTE: `comment` is TOP-LEVEL (not under coverage:). Nesting it under coverage
# makes Codecov reject the whole file and fall back to defaults (relative drop).

coverage:
  status:
    project:
      default:
        # Absolute floor — same as scripts/coverage-gate.py PROJECT_MIN (99%).
        target: 99%
        # Codecov threshold = allowed drop vs base commit. 100% disables the
        # "must not decrease from main" check so only `target` applies (matches gate).
        threshold: 100%
    patch:
      default:
        # Same as coverage-gate.py patch: every changed executable line covered.
        target: 100%
        threshold: 0%

# Top-level (Codecov rejects this under coverage:)
comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: true
  hide_project_coverage: false

# Keep in sync with scripts/coverage-ignore.regex (CI: coverage-ignore-sync-check.py).
# Do NOT ignore domain logic: command, flash, orchestration, process, sdf,
# drive/parse, gui/ops, gui/workers, gui/state, gui/validation, i18n.
ignore:
  - "src/main.rs"
  - "src/gui/mod.rs"
  - "src/gui/views/**"
  - "src/drive/os.rs"
  - "src/gui/file_dialog.rs"
  - "src/process_runner.rs"
