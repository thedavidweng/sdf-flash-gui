coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%

  comment:
    layout: "condensed_header, condensed_files, condensed_footer"
    require_changes: true
    hide_project_coverage: false

# Environment-dependent files excluded from coverage metrics:
# - main.rs: entry point, calls eframe::run_native
# - gui/mod.rs: egui rendering, requires egui::Context + native window
# - drive.rs: platform-specific code with #[cfg(target_os)]
# - gui/file_dialog.rs: NativeDialog impl, calls rfd (native dialogs)
# - gui/process_runner.rs: NativeRunner impl, calls real process::run_command
ignore:
  - "src/main.rs"
  - "src/gui/mod.rs"
  - "src/drive.rs"
  - "src/gui/file_dialog.rs"
  - "src/gui/process_runner.rs"

flags:
  unit:
    paths:
      - src/
    carryforward: true
