version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: build
      include: scope
    ignore:
      # egui-phosphor is pinned to egui 0.34; bump manually with eframe upgrades
      - dependency-name: eframe
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "egui*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      egui:
        patterns:
          - eframe
          - egui*
      dev-deps:
        dependency-type: development
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
