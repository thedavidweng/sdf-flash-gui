name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  update:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(changelog):') &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate CHANGELOG.md
        run: git cliff -o CHANGELOG.md

      - name: Open a pull request when CHANGELOG.md changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/changelog-pr.sh "changelog/${{ github.sha }}" "chore(changelog): sync CHANGELOG.md"