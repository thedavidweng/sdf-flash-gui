name: Changelog

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(changelog):') &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: git-cliff@2.14.2

      - name: Generate CHANGELOG.md
        run: git cliff -o CHANGELOG.md

      - name: Authenticate Git for changelog updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Refresh the changelog pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/changelog-pr.sh
