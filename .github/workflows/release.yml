name: Release Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sdf-flash-gui
            upx: true
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: sdf-flash-gui
            upx: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: sdf-flash-gui
            upx: false # UPX often breaks Apple Silicon code signing/execution
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sdf-flash-gui.exe
            upx: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev upx-ucl

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - name: Install cargo-packager
        run: cargo install cargo-packager

      - name: Build Application
        run: cargo build --release --target ${{ matrix.target }}

      - name: UPX Compress Binary
        if: matrix.upx
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Package Application
        # We pass the target explicitly so packager knows where to find the binary
        run: cargo packager --release --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.appimage
            dist/*.deb
            dist/*.msi
            dist/*.nsis
          if-no-files-found: ignore
