name: Release Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install git-cliff
        run: cargo install git-cliff --version 2.14.2 --locked

      - name: Generate CHANGELOG and release notes
        run: |
          git cliff -o CHANGELOG.md
          if [ "${{ github.ref_type }}" = "tag" ]; then
            git cliff --current --strip header -o RELEASE_BODY.md
          else
            git cliff --latest --strip header -o RELEASE_BODY.md
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-changelog
          path: |
            CHANGELOG.md
            RELEASE_BODY.md

      - name: Verify tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo pkgid | sed -E 's/.*[@#]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Version OK: ${CARGO_VERSION}"

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - run: cargo test

  create-release:
    needs: verify-version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog

      # Preserve coordinated release creation and later asset replacement.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: CHANGELOG.md

  build-other:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sdf-flash-gui
            upx: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sdf-flash-gui.exe
            upx: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev upx-ucl

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: cargo build --release --target ${{ matrix.target }}

      - name: UPX Compress Binary
        if: matrix.upx
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - run: cargo packager --release --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "SHA256SUMS-${{ matrix.target }}.txt"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -- * > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            powershell -Command "Get-ChildItem | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } | Set-Content 'SHA256SUMS-${{ matrix.target }}.txt'"
          fi

      # Preserve coordinated release creation and later asset replacement.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions]
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.msi
            dist/SHA256SUMS-${{ matrix.target }}.txt

  build-macos:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - run: cargo install cargo-packager --version 0.11.8 --locked

      - run: cargo build --release --target ${{ matrix.target }}

      - run: cargo packager --release --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 -- * > "SHA256SUMS-${{ matrix.target }}.txt"

      # Preserve coordinated release creation and later asset replacement.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions]
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            dist/*.dmg
            dist/SHA256SUMS-${{ matrix.target }}.txt

  sync-changelog:
    needs: create-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
          path: release-changelog

      - name: Authenticate Git for changelog updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Open a pull request when CHANGELOG.md changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release-changelog/CHANGELOG.md CHANGELOG.md
          bash scripts/changelog-pr.sh "changelog/${GITHUB_REF_NAME}" "chore(changelog): sync CHANGELOG.md for ${GITHUB_REF_NAME}"

  update-homebrew-tap:
    needs: build-macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thedavidweng/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download DMGs from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo thedavidweng/sdf-flash-gui \
            --dir release-assets \
            --pattern "*.dmg"

      - name: Update cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Exclude legacy SDFFlashGUI DMGs if a release is re-tagged with duplicate assets.
          INTEL_DMG=$(find release-assets -name '*.dmg' ! -name 'SDFFlashGUI*' \( -name '*x86_64*' -o -name '*x64*' -o -name '*intel*' -o -name '*x86*' \) | sort | tail -1)
          ARM_DMG=$(find release-assets -name '*.dmg' ! -name 'SDFFlashGUI*' \( -name '*aarch64*' -o -name '*arm*' -o -name '*apple-silicon*' \) | sort | tail -1)

          if [ -z "$INTEL_DMG" ] || [ -z "$ARM_DMG" ]; then
            echo "::error::Could not find both DMG files. Found:"
            find release-assets -name "*.dmg"
            exit 1
          fi

          INTEL_SHA256=$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')
          ARM_SHA256=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')

          # Only substitute release metadata. URLs keep Ruby #{version} so brew audit
          # does not treat them as unversioned (requires sha256 :no_check).
          export VERSION ARM_SHA256 INTEL_SHA256
          envsubst "\${VERSION} \${ARM_SHA256} \${INTEL_SHA256}" \
            < packaging/homebrew/sdf-flash-gui.rb.template \
            > homebrew-tap/Casks/sdf-flash-gui.rb

          if ! grep -q '#{version}' homebrew-tap/Casks/sdf-flash-gui.rb; then
            echo "::error::Generated cask URLs must interpolate #{version}"
            cat homebrew-tap/Casks/sdf-flash-gui.rb
            exit 1
          fi

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sdf-flash-gui.rb
          git commit -m "Update sdf-flash-gui to ${VERSION}" || echo "No changes to commit"
          git push
