name: Release Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-other:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sdf-flash-gui
            upx: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sdf-flash-gui.exe
            upx: true

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev upx-ucl

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - run: cargo install cargo-packager

      - run: cargo build --release --target ${{ matrix.target }}

      - name: UPX Compress Binary
        if: matrix.upx
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - run: cargo packager --release --target ${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.appimage
            dist/*.deb
            dist/*.msi
            dist/*.nsis

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo install cargo-packager

      - run: cargo build --release --target ${{ matrix.target }}

      - run: cargo packager --release --target ${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  update-homebrew-tap:
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: thedavidweng/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download DMGs from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          # --clobber allows overwriting partial downloads from concurrent runs
          gh release download "${GITHUB_REF_NAME}" \
            --repo thedavidweng/sdf-flash-gui \
            --dir release-assets \
            --pattern "*.dmg" \
            --clobber

      - name: Update cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_URL="https://github.com/thedavidweng/sdf-flash-gui/releases/download/${GITHUB_REF_NAME}"

          # Find DMGs (may be one or both)
          ARM_DMG=$(find release-assets -name "*aarch64*dmg" -o -name "*arm*dmg" -o -name "*apple-silicon*dmg" 2>/dev/null | head -1)
          INTEL_DMG=$(find release-assets -name "*x86_64*dmg" -o -name "*intel*dmg" -o -name "*x86*dmg" 2>/dev/null | head -1)

          if [ -z "$ARM_DMG" ] && [ -z "$INTEL_DMG" ]; then
            echo "::error::No DMG files found in release"
            exit 1
          fi

          # Pull latest cask (may have been updated by the other macOS build)
          cd homebrew-tap
          git pull --rebase origin main || true

          # Build cask content
          CASK=$(cat <<'RUBY_HEADER'
          cask "sdf-flash-gui" do
            version "__VERSION__"
          RUBY_HEADER
          )

          if [ -n "$ARM_DMG" ]; then
            ARM_SHA256=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')
            ARM_FILENAME=$(basename "$ARM_DMG")
            CASK+=$'\n'"    on_arm do"
            CASK+=$'\n'"      sha256 \"${ARM_SHA256}\""
            CASK+=$'\n'"      url \"${RELEASE_URL}/${ARM_FILENAME}\""
            CASK+=$'\n'"    end"
          fi

          if [ -n "$INTEL_DMG" ]; then
            INTEL_SHA256=$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')
            INTEL_FILENAME=$(basename "$INTEL_DMG")
            CASK+=$'\n'"    on_intel do"
            CASK+=$'\n'"      sha256 \"${INTEL_SHA256}\""
            CASK+=$'\n'"      url \"${RELEASE_URL}/${INTEL_FILENAME}\""
            CASK+=$'\n'"    end"
          fi

          CASK+=$'\n'
          CASK+=$'\n'"    name \"SDFFlashGUI\""
          CASK+=$'\n'"    desc \"Cross-platform GUI for flashing optical drives\""
          CASK+=$'\n'"    homepage \"https://github.com/thedavidweng/sdf-flash-gui\""
          CASK+=$'\n'
          CASK+=$'\n'"    livecheck do"
          CASK+=$'\n'"      url :url"
          CASK+=$'\n'"      strategy :github_latest"
          CASK+=$'\n'"    end"
          CASK+=$'\n'
          CASK+=$'\n'"    app \"SDFFlashGUI.app\""
          CASK+=$'\n'
          CASK+=$'\n'"    postflight do"
          CASK+=$'\n'"      system_command \"/usr/bin/xattr\","
          CASK+=$'\n'"                     args: [\"-rd\", \"com.apple.quarantine\", \"#{appdir}/SDFFlashGUI.app\"]"
          CASK+=$'\n'"    end"
          CASK+=$'\n'"  end"

          echo "$CASK" | sed "s/__VERSION__/${VERSION}/" > Casks/sdf-flash-gui.rb

          echo "--- Generated cask ---"
          cat Casks/sdf-flash-gui.rb
          echo "----------------------"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sdf-flash-gui.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update sdf-flash-gui to ${VERSION}"

          # Retry on concurrent push conflict
          for i in 1 2 3; do
            git push && break
            echo "Push failed (attempt $i), pulling and retrying..."
            git pull --rebase origin main
            sleep 2
          done
