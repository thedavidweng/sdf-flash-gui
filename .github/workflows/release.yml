name: Release Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate CHANGELOG and release notes
        run: |
          git cliff -o CHANGELOG.md
          if [ "${{ github.ref_type }}" = "tag" ]; then
            git cliff --current --strip header -o RELEASE_BODY.md
          else
            git cliff --latest --strip header -o RELEASE_BODY.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: |
            CHANGELOG.md
            RELEASE_BODY.md

      - name: Verify tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo pkgid | sed -E 's/.*[@#]([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Version OK: ${CARGO_VERSION}"

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - run: cargo test

  create-release:
    needs: verify-version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-changelog

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: CHANGELOG.md

  build-other:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sdf-flash-gui
            upx: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sdf-flash-gui.exe
            upx: true

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev upx-ucl

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - run: cargo install cargo-packager

      - run: cargo build --release --target ${{ matrix.target }}

      - name: UPX Compress Binary
        if: matrix.upx
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - run: cargo packager --release --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 * > SHA256SUMS.txt
          else
            powershell -Command "Get-ChildItem | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } | Set-Content SHA256SUMS.txt"
          fi

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            dist/*.appimage
            dist/*.deb
            dist/*.msi
            dist/*.nsis
            dist/SHA256SUMS.txt

  build-macos:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo install cargo-packager

      - run: cargo build --release --target ${{ matrix.target }}

      - run: cargo packager --release --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt

  sync-changelog:
    needs: create-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-changelog
          path: release-changelog

      - name: Commit CHANGELOG.md to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp release-changelog/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md already up to date on main"
            exit 0
          fi
          git commit -m "chore(changelog): sync CHANGELOG.md for ${{ github.ref_name }}"
          git push

  update-homebrew-tap:
    needs: build-macos
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: thedavidweng/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download DMGs from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo thedavidweng/sdf-flash-gui \
            --dir release-assets \
            --pattern "*.dmg"

      - name: Update cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_URL="https://github.com/thedavidweng/sdf-flash-gui/releases/download/${GITHUB_REF_NAME}"

          INTEL_DMG=$(find release-assets -name "*x86_64*dmg" -o -name "*intel*dmg" -o -name "*x86*dmg" | head -1)
          ARM_DMG=$(find release-assets -name "*aarch64*dmg" -o -name "*arm*dmg" -o -name "*apple-silicon*dmg" | head -1)

          if [ -z "$INTEL_DMG" ] || [ -z "$ARM_DMG" ]; then
            echo "::error::Could not find both DMG files. Found:"
            find release-assets -name "*.dmg"
            exit 1
          fi

          INTEL_SHA256=$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')
          ARM_SHA256=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')
          INTEL_FILENAME=$(basename "$INTEL_DMG")
          ARM_FILENAME=$(basename "$ARM_DMG")

          cat > homebrew-tap/Casks/sdf-flash-gui.rb <<RUBY
          cask "sdf-flash-gui" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA256}"
              url "${RELEASE_URL}/${ARM_FILENAME}"
            end
            on_intel do
              sha256 "${INTEL_SHA256}"
              url "${RELEASE_URL}/${INTEL_FILENAME}"
            end

            name "SDFFlashGUI"
            desc "Cross-platform GUI for flashing optical drives"
            homepage "https://github.com/thedavidweng/sdf-flash-gui"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "SDFFlashGUI.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/SDFFlashGUI.app"]
            end
          end
          RUBY

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sdf-flash-gui.rb
          git commit -m "Update sdf-flash-gui to ${VERSION}" || echo "No changes to commit"
          git push