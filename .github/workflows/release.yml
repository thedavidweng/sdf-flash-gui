name: Release Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sdf-flash-gui
            upx: true
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: sdf-flash-gui
            upx: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: sdf-flash-gui
            upx: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sdf-flash-gui.exe
            upx: true

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev upx-ucl

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - name: Install cargo-packager
        run: cargo install cargo-packager

      - name: Build Application
        run: cargo build --release --target ${{ matrix.target }}

      - name: UPX Compress Binary
        if: matrix.upx
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Package Application
        run: cargo packager --release --target ${{ matrix.target }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.appimage
            dist/*.deb
            dist/*.msi
            dist/*.nsis

  update-homebrew-tap:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: thedavidweng/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo thedavidweng/sdf-flash-gui \
            --dir release-assets \
            --pattern "*.dmg"

      - name: Compute DMG checksums and update cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          INTEL_DMG=$(find release-assets -name "*x86_64*dmg" -o -name "*intel*dmg" -o -name "*x86*dmg" | head -1)
          ARM_DMG=$(find release-assets -name "*aarch64*dmg" -o -name "*arm*dmg" -o -name "*apple-silicon*dmg" | head -1)

          if [ -z "$INTEL_DMG" ] || [ -z "$ARM_DMG" ]; then
            echo "::error::Could not find DMG files. Found:"
            find release-assets -name "*.dmg"
            exit 1
          fi

          INTEL_SHA256=$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')
          ARM_SHA256=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')

          INTEL_FILENAME=$(basename "$INTEL_DMG")
          ARM_FILENAME=$(basename "$ARM_DMG")

          echo "Version: $VERSION"
          echo "Intel DMG: $INTEL_FILENAME (sha256: $INTEL_SHA256)"
          echo "ARM DMG: $ARM_FILENAME (sha256: $ARM_SHA256)"

          RELEASE_URL="https://github.com/thedavidweng/sdf-flash-gui/releases/download/${GITHUB_REF_NAME}"

          cat > homebrew-tap/Casks/sdf-flash-gui.rb <<RUBY
          cask "sdf-flash-gui" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA256}"
              url "${RELEASE_URL}/${ARM_FILENAME}"
            end
            on_intel do
              sha256 "${INTEL_SHA256}"
              url "${RELEASE_URL}/${INTEL_FILENAME}"
            end

            name "SDFFlashGUI"
            desc "Cross-platform GUI for flashing optical drives"
            homepage "https://github.com/thedavidweng/sdf-flash-gui"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "SDFFlashGUI.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/SDFFlashGUI.app"]
            end
          end
          RUBY

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/sdf-flash-gui.rb
          git commit -m "Update sdf-flash-gui to ${VERSION}" || echo "No changes to commit"
          git push
