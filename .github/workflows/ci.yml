name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - run: cargo clippy -- -D warnings

  sdf-parser-policy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: No unwrap in SDF parser
        shell: bash
        run: |
          count=$(awk '/^#\[cfg\(test\)\]/{exit} {print}' src/sdf.rs | grep -cF '.unwrap(' || true)
          test "$count" -eq 0

  comment-policy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: No explanatory comments on added lines (ADR 0002)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="origin/main"
          fi
          python3 scripts/comment-gate.py --base "$BASE"

  test:
    needs: [fmt, clippy, sdf-parser-policy, comment-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Ubuntu patch gate needs merge-base vs PR base. Default depth=1 omits
          # base.sha / origin/main, so coverage-gate would see an empty patch.
          # Strings keep '0' truthy in the expression (bare 0 is falsy).
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-llvm-cov

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Run tests with coverage
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --target ${{ matrix.target }}

      - name: Run tests with coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ignore set: scripts/coverage-ignore.regex (synced with codecov.yml).
          # One pattern per line → join with `|` (same as scripts/coverage.sh).
          IGNORE_REGEX="$(grep -v '^\s*#' scripts/coverage-ignore.regex | grep -v '^\s*$' | paste -sd '|' -)"
          # Same artifact Codecov consumes — generate once, then gate + upload.
          cargo llvm-cov --lcov --output-path lcov.info --target ${{ matrix.target }} \
            --ignore-filename-regex "${IGNORE_REGEX}"

      - name: Coverage gate (project ≥99%, patch 100% on changed domain lines)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Fail the Ubuntu job here so we do not wait on Codecov UI for the same rules.
          # Prefer PR base SHA; on push use the previous tip; never the all-zero "before".
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # fetch-depth: 0 should already have history; re-fetch base as a fallback.
            git fetch --no-tags origin \
              "${{ github.event.pull_request.base.ref || 'main' }}:refs/remotes/origin/${{ github.event.pull_request.base.ref || 'main' }}"
            BASE="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "error: coverage base '${BASE}' is not available; cannot enforce patch gate" >&2
            exit 1
          fi
          python3 scripts/coverage-gate.py --lcov lcov.info --base "$BASE"

      - name: Coverage ignore lists in sync
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/coverage-ignore-sync-check.py

      - name: Validate codecov.yml
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Reject invalid YAML before upload — an invalid file makes Codecov
          # ignore all settings (absolute floor, ignore paths) and use defaults.
          resp="$(curl -sS --data-binary @codecov.yml https://codecov.io/validate)"
          echo "$resp"
          echo "$resp" | grep -q '^Valid!' || {
            echo "error: codecov.yml failed validation (Codecov would ignore it)" >&2
            exit 1
          }

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Only the llvm-cov artifact (same file coverage-gate.py just checked).
          # disable_search avoids accidentally uploading scripts/*.regex as "coverage".
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false
          # Re-send status after processing so project/patch use this commit's yaml.
          handle_no_reports_found: false