name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - run: cargo clippy -- -D warnings

  sdf-parser-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No unwrap in SDF parser
        shell: bash
        run: |
          count=$(awk '/^#\[cfg\(test\)\]/{exit} {print}' src/sdf.rs | grep -cF '.unwrap(' || true)
          test "$count" -eq 0

  test:
    needs: [fmt, clippy, sdf-parser-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-llvm-cov

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Run tests with coverage
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --target ${{ matrix.target }}

      - name: Run tests with coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ignore set: scripts/coverage-ignore.regex (synced with codecov.yml).
          # One pattern per line → join with `|` (same as scripts/coverage.sh).
          IGNORE_REGEX="$(grep -v '^\s*#' scripts/coverage-ignore.regex | grep -v '^\s*$' | paste -sd '|' -)"
          cargo llvm-cov --lcov --output-path lcov.info --target ${{ matrix.target }} \
            --ignore-filename-regex "${IGNORE_REGEX}"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false