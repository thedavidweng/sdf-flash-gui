name: CI

on:
  push:
    branches:
      - main
      # A maintainer push here (not the GITHUB_TOKEN push the changelog workflow
      # makes) is what starts CI, so the required checks reach the changelog PR.
      - changelog
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt

      - run: cargo fmt -- --check

  clippy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - run: cargo clippy -- -D warnings

  clippy-wasm:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Web demo builds (ADR 0011)
        run: cargo clippy -p sdf-flash-gui -p sdf-flash-gui-web --lib --target wasm32-unknown-unknown -- -D warnings

  sdf-parser-policy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No unwrap in SDF parser
        shell: bash
        run: |
          count=$(awk '/^#\[cfg\(test\)\]/{exit} {print}' src/sdf.rs | grep -cF '.unwrap(' || true)
          test "$count" -eq 0

  comment-policy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No explanatory comments on added lines (ADR 0002)
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="origin/main"
          fi
          python3 scripts/comment-gate.py --base "$BASE"

  install-scripts:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint install.sh (ADR 0012)
        run: shellcheck -s sh site/install.sh scripts/test-install.sh

      - name: Test install.sh under dash and bash
        run: |
          sh scripts/test-install.sh dash
          sh scripts/test-install.sh bash

      - name: Test AppImage permissions
        run: |
          python3 scripts/test-appimage.py
          python3 scripts/test-appimage-update.py

      - name: Lint AppImage scripts
        run: shellcheck -s bash scripts/prepare-appimage.sh scripts/smoke-appimage.sh

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/site/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  appimage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-x11-dev upx-ucl xvfb xdotool libfuse2 libgl1-mesa-dri imagemagick squashfs-tools

      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo build --release
      - run: upx --best --lzma target/release/sdf-flash-gui
      - run: bash scripts/prepare-appimage.sh
      - name: Package updateable AppImage
        env:
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|thedavidweng|sdf-flash-gui|latest|sdf-flash-gui_*_x86_64.AppImage.zsync
        run: |
          cargo packager --release --formats appimage
          mv dist/.cargo-packager/appimage/*.AppImage.zsync dist/
      - run: xvfb-run -a bash scripts/smoke-appimage.sh dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-smoke-window
          path: ${{ runner.temp }}/appimage-smoke.png

  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [fmt, clippy, sdf-parser-policy, comment-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Test macOS release signing and packaging
        if: runner.os == 'macOS'
        run: |
          python3 scripts/test-notarization.py
          python3 scripts/test-package-macos.py

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}
