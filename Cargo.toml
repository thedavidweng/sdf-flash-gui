[package]
name = "sdf-flash-gui"
version = "1.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Cross-platform SDFtool GUI — drive firmware dump/flash for MT1959 optical drives"

[workspace]
members = [".", "web"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
sys-locale = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
codegen-units = 16

[package.metadata.packager]
out-dir = "dist"
formats = ["appimage", "deb", "dmg", "wix"]
product-name = "SDF Flash GUI"
identifier = "com.sdftool.flashgui"
publisher = "SDFtool Team"
copyright = "SDFtool Team"
category = "Utility"
description = "A cross-platform GUI for flashing optical drives."
icons = ["assets/icon.icns", "assets/icon.png"]
resources = ["assets/Credits.html"]
