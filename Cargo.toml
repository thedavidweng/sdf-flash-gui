[package]
name = "sdf-flash-gui"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Cross-platform SDFtool GUI — drive firmware dump/flash for MT1959 optical drives"


[dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui-phosphor = "0.13"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
sys-locale = "0.3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
codegen-units = 16

[package.metadata.packager]
out-dir = "dist"
formats = ["appimage", "deb", "dmg", "wix"]
product-name = "SDF Flash GUI"
identifier = "com.sdftool.flashgui"
publisher = "SDFtool Team"
copyright = "SDFtool Team"
category = "Utility"
description = "A cross-platform GUI for flashing optical drives."
icons = ["assets/icon.icns", "assets/icon.png"]
resources = ["assets/Credits.html"]
